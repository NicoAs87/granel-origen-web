<svg viewBox="0 0 260 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Granel &amp; Origen — menos residuos">
  <defs>
    <linearGradient id="cara" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c68d52"/>
      <stop offset="1" stop-color="#9c6a34"/>
    </linearGradient>
    <style>
      .brown{stroke:#3d2b1e;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#3d2b1e;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .grain{fill:url(#cara)}
      .sage{fill:#7d8b64}
      .sageln{stroke:#7d8b64;fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <circle cx="130" cy="130" r="120" fill="#faf6ef"/>
  <circle cx="130" cy="130" r="120" class="thin" stroke-width="3"/>
  <circle cx="130" cy="130" r="110" class="thin" stroke-width="1.4" stroke-dasharray="2 8"/>

  <!-- Flecha de reciclaje / reutilización alrededor del frasco -->
  <path class="sageln" d="M100 70 a66 66 0 1 0 60 0"/>
  <path class="sage" d="M100 62 l4 18 l14 -9 Z"/>

  <!-- Frasco reutilizable -->
  <rect x="110" y="96" width="40" height="13" rx="4" class="brown"/>
  <path class="brown" d="M108 111 h44 a6 6 0 0 1 6 6 v56 a14 14 0 0 1 -14 14 h-28 a14 14 0 0 1 -14 -14 v-56 a6 6 0 0 1 6 -6 Z"/>

  <!-- Granos dentro -->
  <circle class="grain" cx="120" cy="176" r="4.6"/>
  <circle class="grain" cx="131" cy="179" r="4.6"/>
  <circle class="grain" cx="142" cy="176" r="4.6"/>
  <circle class="grain" cx="126" cy="169" r="4.6"/>
  <circle class="grain" cx="137" cy="169" r="4.6"/>

  <!-- Wordmark -->
  <text x="130" y="284" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="700" fill="#3d2b1e" letter-spacing="1">Granel &amp; Origen</text>
  <text x="130" y="303" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#9c6a34" letter-spacing="3">REUTILIZA · MENOS RESIDUOS</text>
</svg>
