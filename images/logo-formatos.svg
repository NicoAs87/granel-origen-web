<svg viewBox="0 0 260 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Granel &amp; Origen — formatos envasados">
  <defs>
    <linearGradient id="cara" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c68d52"/>
      <stop offset="1" stop-color="#9c6a34"/>
    </linearGradient>
    <style>
      .brown{stroke:#3d2b1e;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#3d2b1e;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .grain{fill:url(#cara)}
      .sage{fill:#7d8b64}
    </style>
  </defs>

  <circle cx="130" cy="130" r="120" fill="#faf6ef"/>
  <circle cx="130" cy="130" r="120" class="thin" stroke-width="3"/>
  <circle cx="130" cy="130" r="110" class="thin" stroke-width="1.4" stroke-dasharray="2 8"/>

  <!-- Hoja natural (acento) -->
  <path class="sage" d="M130 88 c-8 -2 -14 -8 -14 -18 c10 0 16 7 14 18 Z"/>
  <path class="sage" d="M130 88 c8 -2 14 -8 14 -18 c-10 0 -16 7 -14 18 Z"/>
  <path class="thin" stroke="#7d8b64" stroke-width="2" d="M130 90 v-18"/>

  <!-- Bolsa / pouch envasado -->
  <path class="brown" d="M96 116 l7 -12 h54 l7 12"/>
  <path class="brown" d="M96 116 v76 a10 10 0 0 0 10 10 h48 a10 10 0 0 0 10 -10 v-76 Z"/>
  <!-- Muesca superior (sello) -->
  <path class="thin" d="M116 104 h28"/>

  <!-- Etiqueta con pesos -->
  <rect x="110" y="140" width="40" height="42" rx="4" class="thin"/>
  <path class="grain" d="M0 0" />
  <text x="130" y="157" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="700" fill="#9c6a34">250 g</text>
  <text x="130" y="174" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="600" fill="#3d2b1e">1 kg</text>

  <!-- Wordmark -->
  <text x="130" y="284" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="700" fill="#3d2b1e" letter-spacing="1">Granel &amp; Origen</text>
  <text x="130" y="303" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#9c6a34" letter-spacing="3">100 · 250 · 500 g · 1 kg</text>
</svg>
