<svg viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Granel &amp; Origen — selección de origen">
  <defs>
    <linearGradient id="cara" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c68d52"/>
      <stop offset="1" stop-color="#9c6a34"/>
    </linearGradient>
    <style>
      .brown{stroke:#3d2b1e;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#3d2b1e;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .grain{fill:url(#cara)}
      .sage{fill:#7d8b64}
      .sageln{stroke:#7d8b64;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <circle cx="130" cy="130" r="120" fill="#faf6ef"/>
  <circle cx="130" cy="130" r="120" class="thin" stroke-width="3"/>
  <circle cx="130" cy="130" r="110" class="thin" stroke-width="1.4" stroke-dasharray="2 8"/>

  <!-- Suelo -->
  <path class="brown" d="M92 196 q38 -14 76 0"/>
  <path class="grain" d="M112 205 h8 M128 207 h8 M144 205 h6" />

  <!-- Tallo -->
  <path class="sageln" d="M130 196 v-58"/>

  <!-- Hojas del brote -->
  <path class="sage" d="M130 150 c-18 -3 -32 -17 -32 -38 c22 0 35 16 32 38 Z"/>
  <path class="sage" d="M130 150 c18 -3 32 -17 32 -38 c-22 0 -35 16 -32 38 Z"/>
  <path class="thin" stroke="#7d8b64" stroke-width="2" d="M112 128 q10 6 16 16 M148 128 q-10 6 -16 16"/>

  <!-- Semilla / grano de origen -->
  <circle class="grain" cx="130" cy="180" r="6"/>

  <!-- Wordmark -->
  <text x="130" y="272" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="700" fill="#3d2b1e" letter-spacing="1">Granel &amp; Origen</text>
  <text x="130" y="291" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#9c6a34" letter-spacing="3">NATURAL · DE ORIGEN</text>
</svg>
